<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apropos share image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F3F5F4; color: #0E1A1D; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
  .text { position: absolute; left: 72px; top: 76px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 40px; height: 40px; }
  h1 { margin: 40px 0 0; font-size: 80px; line-height: 0.98; font-weight: 700; letter-spacing: -0.045em; word-spacing: 0.05em; }
  .keys { display: flex; gap: 10px; margin-top: 36px; }
  .key { display: grid; align-content: space-between; height: 64px; padding: 10px 12px; border-radius: 11px; background: #FBFCFC; box-shadow: 0 0 0 1px rgba(10,24,28,.17), 0 4px 0 #C9D3D0; font-size: 14px; color: #43504E; box-sizing: border-box; }
  .opt { width: 78px; } .opt span:first-child { justify-self: end; color: #0E1A1D; font-size: 16px; }
  .space { width: 200px; align-content: end; }
  .ring { position: absolute; right: 40px; top: 70px; width: 470px; aspect-ratio: 0.9516648764769066; }
  .ring > img:first-child { width: 100%; height: 100%; }
  .pearl { position: absolute; left: 38.036117381489845%; top: -8.700322234156822%; width: 52.48306997742663%; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../src/assets/icon.png" alt="">Apropos</div>
    <h1>Every command<br>in every app.<br>One key.</h1>
    <div class="keys"><div class="key opt"><span>&#8997;</span><span>option</span></div><div class="key space"><span>space</span></div></div>
  </div>
  <div class="ring"><img src="../src/assets/ring/ring-light.png" alt=""><img class="pearl" src="../src/assets/ring/pearl.png" alt=""></div>
</body>
</html>
