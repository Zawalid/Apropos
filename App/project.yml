name: Apropos
options:
  bundleIdPrefix: com.zawalid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Apropos:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  AproposApp:
    type: application
    platform: macOS
    sources:
      - AproposApp
      - path: ../CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: Apropos
        product: Apropos
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: AproposApp/Apropos.entitlements
      properties:
        # Sparkle is signed by its own identity. A hardened app signed ad hoc (no team) refuses to load a framework
        # signed by a different one and crashes at launch, so library validation has to be off. See docs/updates.md.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: AproposApp/Info.plist
      properties:
        SUFeedURL: https://github.com/Zawalid/Apropos/releases/latest/download/appcast.xml
        # The public half of the update signing key. A placeholder until the key pair exists (docs/updates.md); with the
        # placeholder the updater never starts.
        SUPublicEDKey: REPLACE_WITH_PUBLIC_KEY
        # Never check on its own until the person turns it on in Settings, and never show Sparkle's own prompt.
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        # Menu-bar-only: no Dock icon, no main menu bar of its own.
        LSUIElement: true
        NSHumanReadableCopyright: Copyright 2026 Walid Zakan
        # apropos://run, apropos://open and apropos://search (see docs/integrations.md).
        CFBundleURLTypes:
          - CFBundleURLName: com.zawalid.apropos
            CFBundleURLSchemes:
              - apropos
    settings:
      base:
        PRODUCT_NAME: Apropos
        PRODUCT_MODULE_NAME: AproposApp
        PRODUCT_BUNDLE_IDENTIFIER: com.zawalid.apropos
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # One signed binary: a separate debug dylib signed differently from the app fails to load under hardened runtime.
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Apropos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Debug-only command line tool: draws every preview scene to PNGs (scripts/render-previews.sh). It compiles the app's
  # sources without the @main entry point and never launches the app.
  AproposPreviewRender:
    type: tool
    platform: macOS
    sources:
      - path: AproposApp
        excludes:
          - AproposApp.swift
          - Info.plist
          - Assets.xcassets
      - PreviewRender
    dependencies:
      - package: Apropos
        product: Apropos
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: AproposPreviewRender
        PRODUCT_MODULE_NAME: AproposPreviewRender
        PRODUCT_BUNDLE_IDENTIFIER: com.zawalid.apropos.previewrender
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  AproposPreviewRender:
    build:
      targets:
        AproposPreviewRender: all
    run:
      config: Debug
  Apropos:
    build:
      targets:
        AproposApp: all
    run:
      config: Debug
