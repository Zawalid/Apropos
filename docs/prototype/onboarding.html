<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apropos onboarding</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--out:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.3,1.35,.4,1)}
html[data-theme=dark]{--bg:#0b1418;--bg2:#111d22;--bg3:#182a31;--line:rgba(255,255,255,.08);--tx:#eaf3f1;--tx2:rgba(234,243,241,.64);--tx3:rgba(234,243,241,.46);--mint:#8cf2cc;--mint-ink:#062018;--pearl:#ff8a4c;--page:#060b0e;--shadow:0 30px 80px rgba(0,0,0,.55)}
html[data-theme=light]{--bg:#f2f5f4;--bg2:#e8eeec;--bg3:#dde6e3;--line:rgba(10,24,28,.1);--tx:#0e1a1d;--tx2:rgba(14,26,29,.66);--tx3:rgba(14,26,29,.5);--mint:#0a8f70;--mint-ink:#f2fbf8;--pearl:#e56f2e;--page:#dfe5e3;--shadow:0 30px 70px rgba(20,50,45,.25)}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--page);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh}
#top{position:sticky;top:0;z-index:9;display:flex;gap:14px;justify-content:center;align-items:center;padding:10px;background:color-mix(in srgb,var(--page) 85%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--bg3)}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--tx);font-weight:600}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#stage{display:flex;justify-content:center;padding:34px 20px 80px}
.win{position:relative;width:860px;height:540px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;display:flex}
.tl{position:absolute;left:16px;top:15px;display:flex;gap:8px;z-index:6}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--bg3)}
/* rail */
.rail{width:236px;background:var(--bg2);border-right:1px solid var(--line);padding:56px 24px 24px;display:flex;flex-direction:column;flex:none}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:34px}
.brand img{width:42px;height:42px}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--tx3)}
.steps{position:relative;padding-left:0}
.steps .track{position:absolute;left:5px;top:22px;width:1px;background:var(--line);height:calc(var(--n) * 44px - 44px)}
.steps .fill{position:absolute;left:5px;top:22px;width:1px;background:var(--mint);height:0;transition:height .42s var(--spring)}
.step{position:relative;display:flex;align-items:center;gap:16px;height:44px;font-size:13.5px;color:var(--tx3);padding-left:0}
.step .node{width:11px;height:11px;border-radius:50%;border:1px solid var(--tx3);background:var(--bg2);flex:none;z-index:1;display:grid;place-items:center;transition:background .2s var(--out),border-color .2s var(--out)}
.step.done{color:var(--tx2)}
.step.done .node{background:var(--mint);border-color:var(--mint)}
.step.cur{color:var(--tx);font-weight:500}
.pearl{position:absolute;left:2px;top:0;width:7px;height:7px;border-radius:50%;background:var(--pearl);box-shadow:0 0 9px 2px color-mix(in srgb,var(--pearl) 55%,transparent);transition:transform .42s var(--spring);z-index:3;margin:-3.5px 0 0 0}
.pearl.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 13px 4px color-mix(in srgb,var(--pearl) 50%,transparent)}}
.railnote{margin-top:auto;font-size:12px;color:var(--tx3)}
/* main */
.main{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden}
.body{position:relative;flex:1;padding:58px 56px 0}
.hero{position:absolute;right:-70px;top:92px;width:350px;pointer-events:none}
.kicker{font-size:12px;color:var(--tx3);margin-bottom:14px}
h1{font-size:34px;line-height:1.06;font-weight:600;letter-spacing:-.03em;max-width:360px}
.lead{font-size:14.5px;line-height:1.55;color:var(--tx2);margin-top:14px;max-width:360px}
.demo{margin-top:28px;width:340px;background:var(--bg2);border-radius:12px;overflow:hidden}
.demo .cap{font-size:12px;color:var(--tx3);padding:11px 14px 8px;display:flex;gap:8px;align-items:center}
.demo .r{display:flex;align-items:center;gap:11px;height:36px;padding:0 14px;font-size:13.5px;opacity:0;transform:translateY(4px);animation:rise .22s var(--out) forwards;animation-delay:var(--d,0ms)}
.demo .r i{font-size:16px;color:var(--tx2)}
.demo .r.sel{background:var(--bg3)}
.demo .r span{margin-left:auto;font:500 11px var(--mono);color:var(--tx3)}
@keyframes rise{to{opacity:1;transform:none}}
.foot{display:flex;align-items:center;justify-content:space-between;padding:0 56px 30px}
.btn{all:unset;cursor:pointer;font-size:13.5px;padding:8px 16px;border-radius:8px;background:var(--bg3);color:var(--tx)}
.btn.primary{background:var(--mint);color:var(--mint-ink);font-weight:600}
.btn.ghost{background:none;color:var(--tx2);padding-left:0}
.btn[aria-disabled=true]{opacity:.4;cursor:default}
.slide{animation:in .26s var(--out)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
/* permission */
.sys{margin-top:22px;width:400px;background:var(--bg2);border-radius:12px;overflow:hidden}
.sys .h{font-size:12px;color:var(--tx3);padding:10px 14px;border-bottom:1px solid var(--line)}
.sys .i{display:flex;align-items:center;gap:11px;height:38px;padding:0 14px;font-size:13.5px}
.sys .i+.i{border-top:1px solid var(--line)}
.sys .i .ic{width:20px;height:20px;border-radius:5px;background:var(--bg3)}
.sys .tg{margin-left:auto;width:34px;height:20px;border-radius:10px;background:var(--bg3);position:relative;transition:background .2s var(--out)}
.sys .tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--tx);transition:transform .2s var(--out)}
.sys .tg.on{background:var(--mint)}.sys .tg.on::after{transform:translateX(14px);background:var(--mint-ink)}
.sys .mine{background:color-mix(in srgb,var(--mint) 10%,transparent)}
.state{margin-top:0;font-size:13px;color:var(--tx2);display:flex;gap:9px;align-items:center;height:22px}
.state .dot{width:6px;height:6px;border-radius:50%;background:var(--pearl);animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 7px 1px color-mix(in srgb,var(--pearl) 55%,transparent)}
.state.ok{color:var(--mint)}
.more{margin-top:0;font-size:12.5px;color:var(--tx3);cursor:pointer;display:inline-flex;gap:6px;align-items:center;background:none;border:0}
.srow{display:flex;justify-content:space-between;align-items:center;width:400px;margin-top:14px}
.path{margin-top:10px;width:400px;background:var(--bg2);border-radius:10px;padding:10px 12px;font:12px var(--mono);color:var(--tx2);display:none;line-height:1.5}
.path.on{display:block}
/* try */
.keys{display:flex;gap:8px;margin-top:26px}
.key{min-width:56px;height:56px;padding:0 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font:500 20px var(--mono);box-shadow:0 3px 0 var(--bg3);transition:transform .08s,box-shadow .08s}
.key.down{transform:translateY(3px);box-shadow:none}
.try{margin-top:28px;width:400px;height:190px;border-radius:12px;background:var(--bg2);position:relative;overflow:hidden}
.try .bar{height:9px;margin:16px 18px;border-radius:5px;background:var(--bg3)}
.try .pal{position:absolute;left:30px;right:30px;top:36px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:8px;display:none}
.try .pal.on{display:block;animation:in .0s}
.try .pal .s{font-size:13.5px;color:var(--tx3);padding:6px 8px 8px}
.try .pal .r{display:flex;gap:10px;align-items:center;height:32px;padding:0 8px;border-radius:8px;font-size:13px}
.try .pal .r.sel{background:var(--bg3)}
.try .pal .r i{color:var(--tx2)}
/* done */
.mbar{margin-top:26px;width:400px;height:30px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12.5px;color:var(--tx2)}
.mbar .sp{flex:1}
.mbar svg{color:var(--tx)}
.list{margin-top:18px;width:400px;background:var(--bg2);border-radius:12px}
.list .row{display:flex;align-items:center;gap:12px;height:42px;padding:0 14px;font-size:13.5px;cursor:pointer}
.list .row+.row{border-top:1px solid var(--line)}
.list .row i{color:var(--tx2);font-size:16px}
.list .row .c{margin-left:auto;color:var(--tx3)}
.list .row:hover{background:var(--bg3)}
</style>
</head>
<body>
<div id="top"><span>Theme</span><div class="seg" id="segT"><button data-v="dark">Dark</button><button data-v="light">Light</button></div><span>Step</span><div class="seg" id="segS"><button data-v="0">1</button><button data-v="1">2</button><button data-v="2">3</button><button data-v="3">4</button></div></div>
<div id="stage"></div>
<script>
const $=s=>document.querySelector(s);
const STEPS=['Welcome','Allow Accessibility','Try it','Ready'];
let T='dark',step=0,granted=false,tried=false,tick=null,ctx=0;
const CTX=[
 {cap:'In Finder, 3 items selected',rows:[['ti-folder-plus','New Folder','⇧⌘N'],['ti-copy','Copy path',''],['ti-terminal-2','Open in Terminal here',''],['ti-file-zip','Compress 3 Items','']]},
 {cap:'In Safari, on linear.app/pricing',rows:[['ti-link','Copy as Markdown link',''],['ti-x','Close other tabs from linear.app',''],['ti-send','Send page to Notes',''],['ti-history','Reopen Last Closed Tab','⇧⌘T']]},
 {cap:'In Xcode, on branch feat/panel',rows:[['ti-player-play','Build and Run','⌘R'],['ti-flask','Run Tests','⌘U'],['ti-git-branch','Copy branch name',''],['ti-folder-search','Reveal in Finder','⌥⌘R']]}
];
function demo(){const c=CTX[ctx];return `<div class="cap"><i class="ti ti-focus-2"></i>${c.cap}</div>`+c.rows.map((r,i)=>`<div class="r ${i===0?'sel':''}" style="--d:${i*40}ms"><i class="ti ${r[0]}"></i>${r[1]}<span>${r[2]}</span></div>`).join('')}
const glyph=`<svg width="18" height="18" viewBox="0 0 18 18"><path d="M11.323 3.251A6.2 6.2 0 1 0 15.065 7.711" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="13.749" cy="5.015" r="3" fill="currentColor"/></svg>`;
function content(){
 if(step===0)return `<div class="body slide"><img class="hero" src="assets/hero-ring.png" alt=""><div class="kicker">Step 1 of 4</div><h1>Actions that fit the moment.</h1><p class="lead">Apropos reads the app you are in and offers what fits: its menu commands, plus actions for what you have selected. It runs alongside your launcher.</p><div class="demo" id="demo">${demo()}</div></div>`;
 if(step===1)return `<div class="body slide"><div class="kicker">Step 2 of 4</div><h1>Allow Accessibility.</h1><p class="lead">macOS asks once. Apropos reads the menu bar of the app you are in to list its commands. With context on, it also reads window titles and selections. Nothing leaves this Mac.</p><div class="sys"><div class="h">Privacy and Security, Accessibility</div><div class="i"><span class="ic"></span>Raycast<span class="tg on"></span></div><div class="i mine"><span class="ic" style="background:var(--pearl);opacity:.9"></span>Apropos<span class="tg ${granted?'on':''}" id="tg"></span></div><div class="i"><span class="ic"></span>Stats<span class="tg on"></span></div></div><div class="srow"><div class="state ${granted?'ok':''}" id="state">${granted?'<i class="ti ti-circle-check"></i>Allowed':'<span class="dot"></span>Waiting for access'}</div><button class="more" id="more"><i class="ti ti-chevron-right"></i>Not in the list?</button></div><div class="path" id="path">Click + under the list and choose:<br>/Applications/Apropos.app<br><br>An old entry called Cue can be removed with the minus button.</div></div>`;
 if(step===2)return `<div class="body slide"><div class="kicker">Step 3 of 4</div><h1>Try it in any app.</h1><p class="lead">Switch to an app, then press the shortcut. You can change it later in Settings.</p><div class="keys"><div class="key" id="k1">⌥</div><div class="key" id="k2">Space</div></div><div class="try"><div class="bar" style="width:38%"></div><div class="bar" style="width:72%"></div><div class="bar" style="width:55%"></div><div class="pal ${tried?'on':''}" id="pal"><div class="s">Search Finder commands</div><div class="r sel"><i class="ti ti-folder-plus"></i>New Folder</div><div class="r"><i class="ti ti-copy"></i>Copy path</div><div class="r"><i class="ti ti-terminal-2"></i>Open in Terminal here</div></div></div><div class="state ${tried?'ok':''}" id="state">${tried?'<i class="ti ti-circle-check"></i>That is it. Esc closes it.':'<span class="dot"></span>Press ⌥ Space'}</div></div>`;
 return `<div class="body slide"><div class="kicker">Step 4 of 4</div><h1>Apropos is ready.</h1><p class="lead">It lives in the menu bar. Click it for recent commands and Settings.</p><div class="mbar"><span>Finder</span><span>File</span><span>Edit</span><span class="sp"></span>${glyph}<span>Sun 9:41</span></div><div class="list"><div class="row"><i class="ti ti-command"></i>Create your first command<span class="c"><i class="ti ti-chevron-right"></i></span></div><div class="row"><i class="ti ti-send"></i>Choose where Send to can go<span class="c"><i class="ti ti-chevron-right"></i></span></div><div class="row"><i class="ti ti-sparkles"></i>See what Apropos learns<span class="c"><i class="ti ti-chevron-right"></i></span></div></div></div>`;
}
function footer(){
 const back=step>0?`<button class="btn ghost" id="back">Back</button>`:'<span></span>';
 let next;
 if(step===0)next=`<button class="btn primary" id="next">Continue</button>`;
 if(step===1)next=granted?`<button class="btn primary" id="next">Continue</button>`:`<button class="btn primary" id="open">Open System Settings</button>`;
 if(step===2)next=`<button class="btn primary" id="next" aria-disabled="${!tried}">${tried?'Continue':'Continue'}</button>`;
 if(step===3)next=`<button class="btn primary" id="next">Finish</button>`;
 return `<div class="foot">${back}${next}</div>`;
}
function render(keep){
 document.documentElement.dataset.theme=T;
 const rows=STEPS.map((s,i)=>`<div class="step ${i<step?'done':''} ${i===step?'cur':''}"><span class="node">${i<step?'<i class="ti ti-check" style="font-size:8px;color:var(--mint-ink)"></i>':''}</span>${s}</div>`).join('');
 $('#stage').innerHTML=`<div class="win"><div class="tl"><i></i><i></i><i></i></div><div class="rail"><div class="brand"><img src="assets/app-icon.png" alt=""><div><b>Apropos</b><span>Set up</span></div></div><div class="steps" style="--n:${STEPS.length}"><div class="track"></div><div class="fill" id="fill"></div><span class="pearl ${step===1&&!granted?'pulse':''}" id="pearl"></span>${rows}</div><div class="railnote">Takes about a minute.</div></div><div class="main">${content()}${footer()}</div></div>`;
 const p=$('#pearl');p.style.transform=`translateY(${step*44+22}px)`;$('#fill').style.height=`${step*44}px`;
 $('#segS')&&document.querySelectorAll('#segS button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===step));
 document.querySelectorAll('#segT button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===T));
 const nx=$('#next');if(nx)nx.onclick=()=>{if(step===2&&!tried)return;if(step<3){step++;render()}};
 const bk=$('#back');if(bk)bk.onclick=()=>{step--;render()};
 const op=$('#open');if(op)op.onclick=()=>{op.setAttribute('aria-disabled','true');setTimeout(()=>{granted=true;render()},1400)};
 const mo=$('#more');if(mo)mo.onclick=()=>{$('#path').classList.toggle('on')};
 clearInterval(tick);if(step===0){tick=setInterval(()=>{ctx=(ctx+1)%CTX.length;const d=$('#demo');if(d)d.innerHTML=demo()},3200)}
}
document.querySelectorAll('#segT button').forEach(b=>b.onclick=()=>{T=b.dataset.v;render()});
document.querySelectorAll('#segS button').forEach(b=>b.onclick=()=>{step=+b.dataset.v;if(step>1)granted=true;render()});
let kd=0;
document.addEventListener('keydown',e=>{if(step===2&&e.altKey&&e.code==='Space'){e.preventDefault();$('#k1')?.classList.add('down');$('#k2')?.classList.add('down');if(!tried){tried=true;setTimeout(render,120)}}});
document.addEventListener('keyup',e=>{$('#k1')?.classList.remove('down');$('#k2')?.classList.remove('down')});
render();
</script>
</body>
</html>
