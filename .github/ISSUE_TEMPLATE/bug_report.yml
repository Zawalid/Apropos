name: Bug report
description: Something is wrong, unsafe, or does not do what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If Apropos pressed the wrong control, ran something you did not approve, or read something it
        should not have, say so in the first line of the description. If it is a security problem, do not post it here: use
        the Security tab, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The app that was in front, what was selected, what you typed, what you pressed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Apropos version or commit
      description: Settings, About shows it. For a source build, the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.0
    validations:
      required: true
  - type: textarea
    id: support-info
    attributes:
      label: Support info (optional)
      description: Settings, About, Copy support info. You see everything before you paste it, so read it first.
      render: text
