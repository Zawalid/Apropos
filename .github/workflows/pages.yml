name: Website

# Builds the Astro site in website/ and deploys it to Cloudflare as a Worker with static assets (apropos.zawalid.com, see
# website/wrangler.jsonc). Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts edit + DNS edit) and
# CLOUDFLARE_ACCOUNT_ID. It only runs when the site changes, or by hand (Actions, Website, Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: website
        run: npm run build
      - name: Deploy
        working-directory: website
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
