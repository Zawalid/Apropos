name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The app uses Liquid Glass behind an availability check, which needs the macOS 26 SDK, so everything runs on macos-26.
jobs:
  core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: swift test

  app:
    name: Build the app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd App && xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project App/Apropos.xcodeproj -scheme Apropos \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  # Informational until the codebase has had one full format pass (see CONTRIBUTING.md). Then remove continue-on-error.
  format:
    name: Format check
    runs-on: macos-26
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: swift format lint --strict --recursive Sources Tests App/AproposApp Package.swift
